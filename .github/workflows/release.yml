# Legt für jede Version aus CHANGELOG.md, die noch kein GitHub-Release hat, das Release vX.Y.Z an.
# Steht in der Kopfzeile ein Commit (nachträgliche Historie), zeigt das Release dorthin, sonst auf den aktuellen.
name: Release
# Logik in scripts/release.mjs – dasselbe Skript läuft am PC und in GitLab CI (Regel „GitHub-Unabhängigkeit“, 07.11.2026).

on:
  push:
    branches: [main]
    paths: [package.json, CHANGELOG.md]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fehlende Releases anlegen
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release.mjs --all-missing --title "Handelsblatt Crime Fanwiki"
